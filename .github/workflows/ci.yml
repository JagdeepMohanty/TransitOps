name: TransitOps CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: transitops_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (Root, Server, Client)
        run: |
          npm install
          npm --prefix server install
          npm --prefix client install

      - name: Build Client
        run: npm --prefix client run build

      - name: Run Backend Tests
        env:
          DATABASE_URL: "mysql://root:root@localhost:3306/transitops_test"
          JWT_SECRET: "test_jwt_secret_key_1234567890123456"
          NODE_ENV: test
        run: |
          npm run test

